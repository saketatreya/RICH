name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every version the package claims in requires-python. Advertising a
        # floor nobody runs is a support claim with no evidence behind it.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The offline suite verifies the exact bubblewrap argv the sandbox builds,
      # so BubblewrapExecutor resolves the binary before constructing a command.
      # The runner image does not ship it, and skipping those tests would drop
      # the sandbox-policy coverage that matters most.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: python -m pytest

  package:
    # The wheel is what an operator installs, and it is not what the python
    # job tests: an editable install resolves from src/, so a package list
    # that omitted richbuild.models passed every test while the built wheel
    # could not `import richbuild`. Build the wheel, install it into a venv
    # holding nothing else, and import from a directory where src/ cannot be
    # found by accident. `rich --help` stands in for a version flag the CLI
    # does not have yet.
    runs-on: ubuntu-24.04
    env:
      WHEELS: ${{ runner.temp }}/wheel
      VENV: ${{ runner.temp }}/venv
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip wheel . --no-deps -w "$WHEELS"
      - run: python -m venv "$VENV"
      - run: |
          "$VENV/bin/python" -m pip install "$WHEELS"/*.whl
      - run: |
          "$VENV/bin/python" -c "import richbuild, richbuild.models, richbuild.target_packs"
          "$VENV/bin/rich" --help
        working-directory: ${{ runner.temp }}

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
