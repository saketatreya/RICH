name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every version the package claims in requires-python. Advertising a
        # floor nobody runs is a support claim with no evidence behind it.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The offline suite verifies the exact bubblewrap argv the sandbox builds,
      # so BubblewrapExecutor resolves the binary before constructing a command.
      # The runner image does not ship it, and skipping those tests would drop
      # the sandbox-policy coverage that matters most.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      # Ubuntu 24.04 confines unprivileged user namespaces through AppArmor;
      # the runner is one such host. Lifting it lets sandbox_availability()
      # pass here, which is what an operator on 24.04 has to do too -- and
      # what `rich doctor` tells them.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: python -m pytest

  package:
    # The wheel is what an operator installs, and it is not what the python
    # job tests: an editable install resolves from src/, so a package list
    # that omitted richbuild.models passed every test while the built wheel
    # could not `import richbuild`. Build the canvas and the wheel the way an
    # operator would (tools/build_wheel.py), install it into a venv holding
    # nothing else, and from a directory where src/ and web/ cannot be found
    # by accident: import, print the version, and serve the bundled canvas.
    # $RUNNER_TEMP is read inside the steps: the runner context is not
    # available to a job-level env, and a workflow that names it there is
    # rejected before any job exists -- silently, as a run with no jobs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: python tools/build_wheel.py --skip-install
      - run: test ! -e src/richbuild/canvas
      - run: python -m venv "$VENV"
      - run: |
          "$VENV/bin/python" -m pip install dist/*.whl
      - run: |
          "$VENV/bin/python" -c "import richbuild, richbuild.models, richbuild.target_packs"
          "$VENV/bin/rich" --version | grep -q "^rich 2\."
          "$VENV/bin/python" -c "from richbuild.api import canvas_origin; origin, path = canvas_origin(); assert origin == 'bundled', (origin, path)"
          "$VENV/bin/rich" serve --state-dir "$STATE" --port 8767 --route none &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8767/v1/health >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8767/v1/health | grep -q '"status": *"ok"'
          curl -sf http://127.0.0.1:8767/ | grep -q '<div id="root"'
          kill %1
        working-directory: ${{ runner.temp }}

  image:
    # The image is the other thing an operator installs. Build it, run it the
    # way the README says (port published to the host's loopback, state on a
    # volume), and ask it the two questions that matter: does the canvas come
    # up, and can Bubblewrap unshare a user namespace inside the container --
    # first under Docker's default seccomp profile, then with it unconfined.
    # The first answer is recorded; the second must be yes, or the README's
    # run line is a lie.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: docker build -t rich:ci .
      - run: |
          docker run -d --name rich-default -p 127.0.0.1:8767:8767 -v rich-ci-state:/rich rich:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8767/v1/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8767/v1/health | grep -q '"status": *"ok"'
          curl -sf http://127.0.0.1:8767/ | grep -q '<div id="root"'
          echo "--- rich doctor under the default seccomp profile ---"
          docker exec rich-default rich doctor | tee doctor-default.json | python3 -c "import json,sys; d=json.load(sys.stdin); [print(('ok ' if c['ok'] else 'NO ') + c['name'] + ': ' + c['detail']) for c in d['checks']]"
          docker rm -f rich-default
      - run: |
          docker run -d --name rich-userns -p 127.0.0.1:8767:8767 -v rich-ci-state:/rich --security-opt seccomp=unconfined --security-opt apparmor=unconfined rich:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8767/v1/health >/dev/null && break; sleep 1; done
          echo "--- rich doctor with seccomp and apparmor unconfined ---"
          docker exec rich-userns rich doctor | tee doctor-userns.json | python3 -c "import json,sys; d=json.load(sys.stdin); [print(('ok ' if c['ok'] else 'NO ') + c['name'] + ': ' + c['detail']) for c in d['checks']]; sys.exit(0 if all(c['ok'] for c in d['checks'] if c['required']) else 1)"
          docker rm -f rich-userns

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
