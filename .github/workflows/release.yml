name: Release

# A tag is a release: the wheel with the canvas inside, the image on
# ghcr.io, and a GitHub release carrying the wheel. Nothing is built twice --
# the wheel the release attaches is the wheel the image installs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: python tools/build_wheel.py --skip-npm
      - run: |
          echo "TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: |
          "$(python -c 'import sys; print(sys.executable)')" -m pip install dist/*.whl
          installed="$(rich --version | sed 's/^rich //')"
          test "$installed" = "$TAG" || { echo "tag v$TAG but the wheel says $installed: bump pyproject.toml first"; exit 1; }
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$image:$TAG" -t "$image:latest" .
          docker push "$image:$TAG"
          docker push "$image:latest"
      - run: |
          gh release create "v$TAG" dist/*.whl \
            --title "RICH $TAG" \
            --notes "Wheel with the canvas inside; image ghcr.io/${GITHUB_REPOSITORY,,}:$TAG. See CHANGELOG.md."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
