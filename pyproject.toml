[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rich-agent-build-system"
version = "2.0.0.dev0"
description = "An intent-to-verified-software compiler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Preview migrations run through trusted Python, never a generated process.
    "psycopg[binary]>=3.2,<4",
    # The pnpm lockfile is YAML; the executor parses it to verify toolchain
    # identity before anything is installed.
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
rich = "richbuild.cli:main"

# Discovered, not listed: an explicit list once named richbuild and
# richbuild.target_packs and omitted richbuild.models, so the built wheel
# could not even `import richbuild`. Every package under src/ ships.
[tool.setuptools.packages.find]
where = ["src"]

# The canvas ships inside the wheel: tools/build_wheel.py builds web/ and
# copies web/dist into richbuild/canvas before the wheel is assembled, and
# removes it afterwards so a checkout keeps serving its own fresh build.
[tool.setuptools.package-data]
richbuild = ["canvas/**"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
markers = [
    "live: uses an external model or provider and is skipped unless --run-live is supplied",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
