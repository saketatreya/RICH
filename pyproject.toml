[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rich-agent-build-system"
version = "0.1.0"
description = "An intent-to-verified-software compiler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Preview migrations run through trusted Python, never a generated process.
    "psycopg[binary]>=3.2,<4",
    # The pnpm lockfile is YAML; the executor parses it to verify toolchain
    # identity before anything is installed.
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
rich = "richbuild.cli:main"

[tool.setuptools]
packages = ["richbuild", "richbuild.target_packs"]

[tool.setuptools.package-dir]
richbuild = "src/richbuild"
"richbuild.target_packs" = "src/richbuild/target_packs"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
markers = [
    "live: uses an external model or provider and is skipped unless --run-live is supplied",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
